# Render Blueprint for the immersive-learning static site.
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: immersive-learning
    runtime: static
    buildCommand: echo "Publishing static files"
    staticPublishPath: .
    routes:
      - type: redirect
        source: /
        destination: /prisma-anatomy-assembly.html
    headers:
      - path: /prisma-models/*
        name: Content-Type
        value: model/gltf-binary
      - path: /prisma-models/*
        name: Cache-Control
        value: public, max-age=31536000
      - path: /*
        name: X-Content-Type-Options
        value: nosniff

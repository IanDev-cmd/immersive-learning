,rot,parent=root){\n  const g=new THREE.Group();\n  g.add(new THREE.Mesh(geo,fillMat));\n  g.add(new THREE.LineSegments(new THREE.EdgesGeometry(geo,25),lineMat));\n  g.position.set(...pos);if(rot)g.rotation.set(...rot);parent.add(g);\n  if(dir)parts.push({g,b:g.position.clone(),d:new THREE.Vector3(...dir),a:amt});\n  return g;\n}\nconst B=(x,y,z)=>new THREE.BoxGeometry(x,y,z);\nconst C=(r,h,s=16)=>new THREE.CylinderGeometry(r,r,h,s);\n\n// 02 base pedestal\nconst ped=add(B(3.4,2.6,3.4),[0,-3.15,0],[0,-1,0],2.6);\n[-1,1].forEach(s=>add(B(1.3,1.9,.06),[s*.8,-3.15,1.72],[0,-1,0],2.6));\nadd(B(4.1,.28,4.1),[0,-1.7,0],[0,-1,0],1.7);\n[[-1,-1],[1,-1],[-1,1],[1,1]].forEach(([sx,sz])=>add(B(.6,.35,.6),[sx*1.95,-1.4,sz*1.95],[0,-1,0],1.7));\n// 04 chassis frame\nconst fy=-.75;\n[-1,1].forEach(s=>{add(B(6,.34,.5),[0,fy,s*2.75],[0,1,0],.7);add(B(.5,.34,5),[s*2.75,fy,0],[0,1,0],.7)});\nfor(let i=0;i<6;i++)add(B(.16,.16,5),[-2.1+i*.84,fy-.02,0],[0,1,0],.7);\n// dampers + helical springs\nconst dampers=[];\n[[-1,-1],[1,-1],[-1,1],[1,1]].forEach(([sx,sz])=>{\n  const g=new THREE.Group();g.position.set(sx*2.85,-1.2,sz*2.85);root.add(g);\n  const pts=[];for(let i=0;i<=160;i++){const t=i/160,a=t*Math.PI*2*5;pts.push(new THREE.Vector3(Math.cos(a)*.2,-.3+t*.6,Math.sin(a)*.2))}\n  g.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),lineMat));\n  [-.34,.34].forEach(y=>{const w=new THREE.Group();w.position.y=y;g.add(w);w.add(new THREE.Mesh(C(.28,.06,20),fillMat));w.add(new THREE.LineSegments(new THREE.EdgesGeometry(C(.28,.06,20),25),lineMat))});\n  parts.push({g,b:g.position.clone(),d:new THREE.Vector3(sx*.7,-.8,sz*.7),a:1.2});dampers.push(g);\n});\n// 01 & 03 signal fins\nconst sh=new THREE.Shape();\n[[-1.6,0],[1.6,0],[2.1,.5],[2.1,3.1],[1.6,3.6],[-1.6,3.6],[-2.1,3.1],[-2.1,.5]].forEach((p,i)=>i?sh.lineTo(...p):sh.moveTo(...p));\nfor(let i=0;i<9;i++)[.25,3.35].forEach(y=>{const h=new THREE.Path();h.absarc(-1.6+i*.4,y,.06,0,7,true);sh.holes.push(h)});\nconst finGeo=new THREE.ExtrudeGeometry(sh,{depth:.08,bevelEnabled:false});\nfinGeo.translate(0,0,-.04);finGeo.rotateY(Math.PI/2);\nconst fins=[];\nfor(let i=0;i<7;i++)fins.push(add(finGeo,[-2.4+i*.8,fy+.17,0],[(i-3)*.55,.7,0],1,[0,.22,0]));\n// 06 fasteners\nconst bolts=[];\n[[-2.9,-2.6],[2.9,-2.6],[-2.9,2.6],[2.9,2.6],[0,-3.2],[0,3.2]].forEach(([x,z])=>{\n  const g=new THREE.Group();g.position.set(x,5.4,z);root.add(g);\n  const hd=new THREE.Group();g.add(hd);\n  [[C(.15,.13,6),.06],[C(.05,.8,10),-.4]].forEach(([geo,y])=>{const m=new THREE.Group();m.position.y=y;m.add(new THREE.Mesh(geo,fillMat),new THREE.LineSegments(new THREE.EdgesGeometry(geo,25),lineMat));g.add(m)});\n  const dl=new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,-.8,0),new THREE.Vector3(0,-5.4,0)]),dashMat);dl.computeLineDistances();g.add(dl);\n  parts.push({g,b:g.position.clone(),d:new THREE.Vector3(0,1,0),a:1.6});bolts.push(g);\n});\n\n/* portal rift billboard */\nconst rift=new THREE.Mesh(new THREE.PlaneGeometry(26,26),new THREE.ShaderMaterial({transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,uniforms:U,\nvertexShader:`varying vec2 v;void main(){v=uv-.5;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,\nfragmentShader:`uniform float uP,uT;varying vec2 v;\nvoid main(){float r=length(v)*2.;float a=atan(v.y,v.x)+r*5.-uT*.8;\nfloat ring=exp(-pow((r-.55)*9.,2.))*(.55+.45*sin(a*6.+uT*2.));\nfloat core=exp(-r*r*5.)*.25;\nvec3 c=mix(vec3(1.,.5,.1),vec3(.1,.85,1.),.5+.5*sin(a*2.+uT));\ngl_FragColor=vec4(c*(ring+core)*uP*1.4,1.);}`}));\nrift.visible=false;scene.add(rift);\n\n/* ---------- pins ---------- */\nconst pinDefs=[['01',fins[2],[0,3.2,0]],['02',ped,[1.7,.3,1.7]],['03',fins[5],[0,2.4,1.9]],['04',dampers[2],[.3,0,.3]],['06',bolts[0],[0,.3,0]]];\nconst pins=pinDefs.map(([n,o,off])=>{const d=document.createElement('div');d.className='pin';d.textContent=n;pinsEl.appendChild(d);return{d,o,off:new THREE.Vector3(...off)}});\nconst tmp=new THREE.Vector3();\n\n/* ---------- state ---------- */\nlet mode='iso',ex=0,exT=0,portal=0,portalT=0,dt0=0;\nconst drone=new THREE.CatmullRomCurve3([[-9,5,11],[-4,2.5,6.5],[-1.5,1.2,3.5],[1.5,.6,-4],[6,-.5,-2],[6.5,-1,4.5],[3.5,-1.8,6.5],[0,8,12],[-9,5,11]].slice(0,-1).map(p=>new THREE.Vector3(...p)),true,'catmullrom',.5);\nconst look=new THREE.CatmullRomCurve3([[0,1,0],[-1,1.5,0],[0,1,0],[0,1.2,-1],[2.8,-1.2,2.8],[2.8,-1.2,2.8],[2.5,-1.2,2.5],[0,1,0]].map(p=>new THREE.Vector3(...p)),true);\nconst mbtn=[...document.querySelectorAll('[data-m]')];\nfunction setMode(m){\n  mode=m;controls.enabled=m==='orbit';\n  if(m==='drone'&&exT<.5){exT=.6;exr.value=.6}\n  document.querySelectorAll('#ctl [data-m]').forEach(b=>b.classList.toggle('on',b.dataset.m===m));\n  document.querySelectorAll('#rail .ix').forEach(b=>b.classList.toggle('on',b.dataset.m===m));\n}\nmbtn.forEach(b=>b.onclick=()=>setMode(b.dataset.m));\nconst exr=$('#exr');\nexr.oninput=()=>exT=+exr.value;\n$('#exb').onclick=()=>{exT=exT>.5?0:1;exr.value=exT};\nconst tp=()=>{portalT=portalT?0:1;document.body.classList.toggle('portal',!!portalT)};\n$('#evt').onclick=tp;$('#num').addEventListener('click',e=>{if(e.target.closest('path,polygon'))tp()});\n$('#cls').onclick=()=>$('#card').style.display='none';\naddEventListener('keydown',e=>{const m={1:'iso',2:'drone',3:'orbit'}[e.key];if(m)setMode(m);if(e.key==='e')$('#exb').click();if(e.key==='p')tp()});\n\n/* ---------- resize ---------- */\nfunction resize(){\n  S=Math.min(innerWidth/736,innerHeight/552);\n  const SW=innerWidth/S,SH=innerHeight/S;\n  stage.style.width=SW+'px';stage.style.height=SH+'px';\n  stage.style.setProperty('--dy',(SH-552)+'px');\n  stage.style.transform=`scale(${S})`;\n  W=SW-270;H=SH;\n  for(const e of [view,pinsEl]){e.style.width=W+'px';e.style.height=H+'px'}\n  cam.aspect=W/H;cam.updateProjectionMatrix();\n  const pr=Math.min(devicePixelRatio*S,3);\n  renderer.setPixelRatio(pr);renderer.setSize(W,H,false);comp.setPixelRatio(pr);comp.setSize(W,H);bloom.resolution.set(W,H);\n}\naddEventListener('resize',resize);resize();\n\n/* ---------- loop ---------- */\nconst clk=new THREE.Clock(),bgA=new THREE.Color(0xD9D7D2),bgB=new THREE.Color(0x07090f);\nlet dronet=0;\nfunction frame(){\n  const dt=Math.min(clk.getDelta(),.05);U.uT.value+=dt;\n  ex+=(exT-ex)*Math.min(1,dt*4);\n  portal+=(portalT-portal)*Math.min(1,dt*2.5);U.uP.value=portal;\n  parts.forEach(p=>p.g.position.copy(p.b).addScaledVector(p.d,p.a*ex));\n  lineMat.color.copy(INK).lerp(GLOW,portal);dashMat.color.copy(lineMat.color);\n\n  const tf=mode==='drone'?42:14;cam.fov+=(tf-cam.fov)*Math.min(1,dt*3);cam.updateProjectionMatrix();\n  if(mode==='iso'){cam.position.lerp(ISO,Math.min(1,dt*4));controls.target.lerp(ORG,Math.min(1,dt*4));cam.lookAt(controls.target)}\n  else if(mode==='drone'){\n    dronet=(dronet+dt/28)%1;\n    cam.position.lerp(drone.getPointAt(dronet),Math.min(1,dt*3));\n    controls.target.lerp(look.getPointAt(dronet),Math.min(1,dt*3));cam.lookAt(controls.target);\n  }else controls.update();\n\n  rift.visible=portal>.01;\n  if(rift.visible){rift.position.copy(cam.position).sub(controls.target).normalize().multiplyScalar(-10).add(ORG);rift.lookAt(cam.position)}\n  bloom.strength=1.05*portal;\n  if(portal>.01){scene.background=bgA.clone().lerp(bgB,portal);comp.render()}\n  else{scene.background=null;renderer.render(scene,cam)}\n\n  pins.forEach(p=>{\n    tmp.copy(p.off);p.o.localToWorld(tmp);tmp.project(cam);\n    p.d.style.left=(tmp.x*.5+.5)*W+'px';p.d.style.top=(-tmp.y*.5+.5)*H+'px';\n    p.d.style.background=portal>.5?'#FF9436':'#1a1a1a';p.d.style.color=portal>.5?'#1a1a1a':'#fff';\n  });\n  requestAnimationFrame(frame);\n}\nframe();\n<\/script>\n<script>\n(function(){\nvar kj=[].slice.call(document.querySelectorAll(\"#rail div\")).filter(function(d){return d.textContent.trim()===\"KJ\"})[0];\nif(kj){kj.style.cursor=\"pointer\";kj.style.zIndex=40;kj.title=\"Open PLACEBO/25\";kj.addEventListener(\"click\",function(){parent.postMessage({go:\"placebo\"},\"*\")})}\nv
